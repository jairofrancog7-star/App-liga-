name: Verificar servicio Web Push de producción
on:
  workflow_dispatch:
  schedule:
    - cron: '17 15 * * *'
  push:
    paths:
      - '.github/workflows/notifications-push-readiness.yml'
      - 'src/v1082-push-notifications.js'
      - 'demo/src/v1082-push-notifications.js'
      - 'tests/notification-push-*.test.mjs'
      - 'server/notifications/index.mjs'

permissions:
  contents: read

concurrency:
  group: liga-jr-public-push-health
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Revisar sintaxis del cliente y servidor
        run: |
          node --check src/v1082-push-notifications.js
          node --check server/notifications/index.mjs
          node --test tests/notification-push-readiness-v1225.test.mjs tests/notification-push-confirmation-v1226.test.mjs tests/notification-push-self-test-v1227.test.mjs
      - name: Probar API Web Push real (sin enviar avisos ni exponer claves)
        env:
          PUSH_API_URL: https://liga-avisos-api-production.up.railway.app
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base=process.env.PUSH_API_URL;
          assert.match(base,/^https:\/\/[^/]+$/);
          async function get(path){
            let error;
            for(let attempt=1;attempt<=3;attempt++){
              try{
                const response=await fetch(base+path,{
                  headers:{Accept:'application/json'},
                  signal:AbortSignal.timeout(12000),
                  redirect:'error'
                });
                assert.equal(response.status,200,path+' debe devolver HTTP 200');
                return await response.json();
              }catch(err){
                error=err;
                if(attempt<3)await new Promise(resolve=>setTimeout(resolve,2500));
              }
            }
            throw new Error(path+': '+error.message);
          }
          const health=await get('/health/ready');
          assert.equal(health.ready,true,'Backend sin readiness');
          assert.equal(health.database,'connected','PostgreSQL desconectado');
          assert.equal(health.schedulerEnabled,true,'Programador interno desactivado');
          assert.equal(health.pushEnabled,true,'Web Push sin configurar');
          const key=await get('/api/push/public-key');
          assert.ok(typeof key.publicKey==='string'&&key.publicKey.length>70,'VAPID pública ausente');
          assert.match(key.publicKey,/^[A-Za-z0-9_-]+$/,'VAPID pública inválida');
          const config=await get('/config');
          assert.equal(config.pushEnabled,true,'Config pública no habilitada');
          assert.equal(config.vapidPublicKey,key.publicKey,'Clave VAPID distinta entre endpoints');
          // Verificar que el endpoint de prueba privada EXISTE pero rechaza
          // solicitudes sin suscripción: jamás envía un mensaje en CI.
          const denied=await fetch(base+'/api/push/self-test',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({subscription:{endpoint:'invalid'}}),
            signal:AbortSignal.timeout(12000),
            redirect:'error'
          });
          assert.equal(denied.status,400,'La prueba privada debe rechazar dispositivos no registrados');
          console.log('OK: prueba privada protegida (400 sin suscripción).');
          console.log('OK: HTTPS, PostgreSQL, programador y VAPID listos.');
          console.log('Nota: esta prueba NO confirma suscripciones ni entrega real en Android cerrado.');
          NODE
