name: Editor visual táctil y CMS privado
on:
  push:
    branches:
      - main
      - feat/editor-cms-touch-v1236-20261010
    paths:
      - 'src/v1225-editor-visual-studio.js'
      - 'src/v1225-editor-visual-studio.css'
      - 'src/v1236-editor-cms-bridge.js'
      - 'tests/editor-visual-mobile-v1236.mjs'
      - '.github/workflows/editor-visual-mobile-v1236.yml'
  pull_request:
    paths:
      - 'src/v1225-editor-visual-studio.js'
      - 'src/v1225-editor-visual-studio.css'
      - 'src/v1236-editor-cms-bridge.js'
      - 'tests/editor-visual-mobile-v1236.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-simulado:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador de pruebas
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Probar edición táctil, deshacer, restaurar y guardar borrador CMS
        run: node tests/editor-visual-mobile-v1236.mjs
      - name: Guardar capturas móviles simuladas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-visual-android-simulado
          path: artifacts/editor-visual-v1236/
          if-no-files-found: ignore
          retention-days: 7
