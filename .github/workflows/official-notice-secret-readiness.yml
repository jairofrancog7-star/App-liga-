name: Diagnosticar aprobación privada y Web Push (sin enviar)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/official-notice-secret-readiness.yml'
      - '.github/workflows/approve-official-notice.yml'
      - '.github/workflows/scheduled-notices.yml'
      - 'server/notifications/index.mjs'
      - 'src/v1082-push-notifications.js'
  schedule:
    - cron: '30 15 * * *'

permissions:
  contents: read

concurrency:
  group: official-approval-push-readiness
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ejecutar pruebas sin activar avisos reales
        run: |
          node --test tests/review-official-safety.test.mjs \
            tests/notification-push-readiness-v1225.test.mjs \
            tests/notification-push-confirmation-v1226.test.mjs \
            tests/notification-push-self-test-v1227.test.mjs
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Verificar existencia de la clave HMAC, sin exponerla
        env:
          LJR_OFFICIAL_NOTICE_APPROVAL_SECRET: ${{ secrets.LJR_OFFICIAL_NOTICE_APPROVAL_SECRET }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          key=os.environ.get('LJR_OFFICIAL_NOTICE_APPROVAL_SECRET','')
          ready=len(key)>=32
          summary=os.environ['GITHUB_STEP_SUMMARY']
          with open(summary,'a',encoding='utf-8') as f:
              f.write('## Aprobación de avisos programados (archivo JSON)\n\n')
              if ready:
                  f.write('✅ Clave privada configurada con longitud mínima válida. No se revela su contenido.\n\n')
              else:
                  f.write('⚠️ Falta configurar la clave privada o no cumple longitud mínima. Los avisos del archivo JSON permanecerán bloqueados.\n\n')
          if not ready:
              print('::warning title=Configuración manual pendiente::Agregar LJR_OFFICIAL_NOTICE_APPROVAL_SECRET en Settings > Secrets and variables > Actions. No pegar su valor en logs.')
          else:
              print('Comprobación de existencia de clave aprobada; valor no mostrado.')
          PY
      - name: Verificar servidor oficial y VAPID sin realizar envíos
        env:
          PUSH_URL: https://liga-avisos-api-production.up.railway.app
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {appendFileSync} from 'node:fs';
          const base=process.env.PUSH_URL;
          async function json(path){
            let last;
            for(let i=0;i<3;i++){
              try{
                const response=await fetch(base+path,{headers:{Accept:'application/json'},signal:AbortSignal.timeout(12000),redirect:'error'});
                assert.equal(response.status,200,path+' HTTP');
                return await response.json();
              }catch(err){last=err;if(i<2)await new Promise(resolve=>setTimeout(resolve,1500));}
            }
            throw last;
          }
          const health=await json('/health/ready');
          assert.equal(health.ready,true,'Servidor no disponible');
          assert.equal(health.database,'connected','Base de datos');
          assert.equal(health.approvalRequired,true,'Falta control de autorización de Presidencia');
          assert.equal(health.schedulerEnabled,true,'Programador');
          assert.equal(health.pushEnabled,true,'Web Push');
          const publicKey=await json('/api/push/public-key');
          assert.ok(typeof publicKey.publicKey==='string'&&publicKey.publicKey.length>70);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '## Backend de avisos y Web Push\n\n✅ Servidor HTTPS, PostgreSQL, aprobación obligatoria, programador y VAPID disponibles.\n\n'+
            '**Sin prueba de entrega:** estos controles no envían notificaciones ni demuestran recepción en un Android cerrado. La prueba real debe iniciarse desde un teléfono que dio permiso.\n');
          console.log('Servicio y VAPID comprobados; no se enviaron mensajes.');
          NODE
