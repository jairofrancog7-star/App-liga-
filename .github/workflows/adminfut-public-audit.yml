name: Sincronizar fichas publicas de jugadores AdminFut
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/sync-adminfut-public-players.mjs'
      - '.github/workflows/adminfut-public-audit.yml'
  schedule:
    - cron: '18 12 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: adminfut-public-players-audit
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probar importacion deportiva sin datos personales
        run: node --test tests/adminfut-public-registrations.test.mjs
      - name: Revisar todos los equipos, fotos y cedulas oficiales
        run: node scripts/sync-adminfut-public-players.mjs
      - name: Validar que ambas copias de datos sean identicas
        run: |
          cmp data/official-live.json public/data/official-live.json
          node -e "const d=require('./data/official-live.json'); if(!['1','2','3','4','5'].every(k=>d.categories[k])) process.exit(1)"
      - name: Publicar altas deportivas y fotos verificadas
        id: publish
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/official-live.json public/data/official-live.json data/adminfut-public-audit.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Sin altas o cambios deportivos confirmados.'
            exit 0
          fi
          git commit -m 'data(adminfut): nuevas inscripciones y fotos oficiales sin CURP'
          # Conserva las modificaciones simultaneas del usuario sin forzar main.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo 'Conflicto real con datos actuales: no sobrescribir cambios del usuario.'
              exit 1
            fi
            sleep 2
          done
          echo 'GitHub recibio otras modificaciones durante todos los intentos.'
          exit 1
      - name: Publicar cambios en GitHub Pages
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" -f ref=main
