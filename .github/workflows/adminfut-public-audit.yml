name: Sincronizar fichas publicas de jugadores AdminFut
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/sync-adminfut-public-players.mjs'
      - '.github/workflows/adminfut-public-audit.yml'
  schedule:
    - cron: '18 12 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: adminfut-public-players-audit
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probar importacion deportiva sin datos personales
        run: node --test tests/adminfut-public-registrations.test.mjs
      - name: Revisar todos los equipos, fotos y cedulas oficiales
        run: node scripts/sync-adminfut-public-players.mjs
      - name: Validar que ambas copias de datos sean identicas
        run: |
          cmp data/official-live.json public/data/official-live.json
          node -e "const d=require('./data/official-live.json'); if(!['1','2','3','4','5'].every(k=>d.categories[k])) process.exit(1)"
      - name: Preparar propuesta de cambios deportivos para revisión
        id: publish
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/official-live.json public/data/official-live.json data/adminfut-public-audit.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Sin altas ni cambios confirmados.'
            exit 0
          fi
          git commit -m 'data(adminfut): propuesta de fichas y fotos deportivas públicas'
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Abrir PR sin modificar main
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          BRANCH="audit/adminfut-public-${{ github.run_id }}"
          git push origin "HEAD:refs/heads/$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Auditoría AdminFut: fichas, fotos y cédulas públicas" \
            --body "Propuesta automática pendiente de revisión humana. Solo datos deportivos públicos de las cinco categorías; ninguna CURP, documento o fecha de nacimiento. Verificar altas, cambios de equipo y diferencias en cédulas antes de fusionar. Los marcadores y puntos no se aplican automáticamente."
