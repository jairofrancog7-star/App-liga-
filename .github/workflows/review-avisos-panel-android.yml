name: Revisar avisos - prueba visual móvil aislada
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/v1075-admin-editor-center.js'
      - 'src/v1075-admin-editor-center.css'
      - 'tests/review-avisos-panel-android.mjs'
      - '.github/workflows/review-avisos-panel-android.yml'
  push:
    branches: [main]
    paths:
      - 'src/v1075-admin-editor-center.js'
      - 'src/v1075-admin-editor-center.css'
      - 'tests/review-avisos-panel-android.mjs'
      - '.github/workflows/review-avisos-panel-android.yml'
permissions:
  contents: read
concurrency:
  group: review-avisos-mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  revisar:
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright temporal para la prueba
        run: |
          npm install --no-save playwright@1.55.0 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Ejecutar revisión táctil (sin credenciales, sin servidor)
        run: node tests/review-avisos-panel-android.mjs
      - name: Guardar imágenes y diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revisar-avisos-android-simulado
          path: artifacts/revisar-avisos-android
          if-no-files-found: ignore
