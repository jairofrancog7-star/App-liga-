name: Ejecutar avisos Twilio y Web Push

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liga-jr-twilio-push-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar programador seguro
        run: node --test .github/scripts/dispatch-notifications.test.mjs
      - name: Ejecutar envíos autorizados y vencidos
        env:
          NOTIFICATIONS_API_URL: ${{ secrets.NOTIFICATIONS_API_URL }}
          NOTIFICATIONS_JOB_TOKEN: ${{ secrets.NOTIFICATIONS_JOB_TOKEN }}
        run: node .github/scripts/dispatch-notifications.mjs
