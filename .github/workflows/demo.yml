name: Publicar demo estático

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'demo/**'
      - '*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: demo-static-main
  cancel-in-progress: true

jobs:
  build-demo:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Build demo portable
        run: npm run build -- --base=./

      - name: Guardar demo en el repositorio
        run: |
          rm -rf demo
          mkdir -p demo
          cp -R dist/. demo/
          node scripts/ensure-demo-notice-css.mjs
          touch demo/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo
          if git diff --cached --quiet; then
            echo "Demo sin cambios"
          else
            remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
            if [ "$remote_head" != "$GITHUB_SHA" ]; then
              echo "Hay una versión más nueva; se omite este demo para no publicar una copia vieja."
              exit 0
            fi
            git commit -m "chore: actualizar demo estático [skip ci]"
            git push origin main
          fi
