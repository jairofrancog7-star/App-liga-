name: Publicar demo estático

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'demo/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install

      - name: Build demo portable
        run: npm run build -- --base=./

      - name: Guardar demo en el repositorio
        run: |
          rm -rf demo
          mkdir -p demo
          cp -R dist/. demo/
          touch demo/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo
          if git diff --cached --quiet; then
            echo "Demo sin cambios"
          else
            git commit -m "chore: actualizar demo estático [skip ci]"
            git push origin main
          fi
