name: Instalador - prueba visual Android

on:
  push:
    branches: [main]
    paths:
      - 'tests/install-center-mobile-visual-v1241.mjs'
      - '.github/workflows/install-center-visual-v1241.yml'
      - 'src/v1160-install-center.js'
      - 'src/v1240-install-unified-navy-local.css'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-install-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mobile-visual:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build GitHub Pages version
        run: npm run build -- --base=/App-liga-/

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Start local preview
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/install-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/App-liga-/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/install-preview.log
          exit 1

      - name: Verify install colors, buttons and 393px/360px mobile screenshots
        run: node tests/install-center-mobile-visual-v1241.mjs

      - name: Upload mobile screenshots and findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Liga-Instalacion-Android-V1241
          path: artifacts/install-center-mobile/
          if-no-files-found: warn
          retention-days: 14
