name: Verificar Junta de la Liga

on:
  push:
    branches: [main]
    paths:
      - 'src/v105-green-app-bottom.js'
      - 'src/v1130-meeting-hub.js'
      - 'src/v1140-meeting-suite.js'
      - 'src/v1130-meeting-hub.css'
      - 'src/v1140-meeting-suite.css'
      - 'src/v1150-meeting-sync.js'
      - 'server/notifications/meeting-store.mjs'
      - 'server/notifications/index.mjs'
      - 'server/notifications/schema.sql'
      - 'server/notifications/authorization.mjs'
      - 'server/notifications/bootstrap.mjs'
      - 'tests/meeting-private-sync-v1150.test.mjs'
      - 'tests/meeting-access-regression-v1151.test.mjs'
      - 'tests/meeting-admin-session-v1152.test.mjs'
      - 'scripts/smoke-juntas-live.mjs'
      - 'index.html'
      - 'tests/meeting-hub-v1130.test.mjs'
      - 'tests/meeting-suite-v1140.test.mjs'
      - '.github/workflows/meeting-juntas.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meeting-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar flujos y permisos de juntas
        run: node --test tests/meeting-hub-v1130.test.mjs tests/meeting-suite-v1140.test.mjs tests/meeting-private-sync-v1150.test.mjs tests/meeting-access-regression-v1151.test.mjs tests/meeting-admin-session-v1152.test.mjs
      - name: Comprobar servidor Railway en vivo (sin credenciales)
        continue-on-error: true
        run: node scripts/smoke-juntas-live.mjs
      - name: Comprobar sintaxis JS
        run: |
          node --check src/v1130-meeting-hub.js
          node --check src/v1140-meeting-suite.js
          node --check src/v1150-meeting-sync.js
          node --check server/notifications/meeting-store.mjs
          node --check server/notifications/index.mjs
          node --check src/v105-green-app-bottom.js
