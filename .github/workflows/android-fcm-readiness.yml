name: Verificar preparación Firebase Android (FCM)
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-fcm-readiness.yml'
      - '.github/workflows/android-debug.yml'
      - 'scripts/android-fcm-preflight.mjs'
      - 'tests/android-fcm-preflight.test.mjs'

permissions:
  contents: read

concurrency:
  group: fcm-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probar validación y evitar falsos positivos
        run: node --test tests/android-fcm-preflight.test.mjs
      - name: Confirmar disponibilidad de configuración FCM (no enviar Push)
        env:
          FIREBASE_ANDROID_CONFIG_B64: ${{ secrets.FIREBASE_ANDROID_CONFIG_B64 }}
        run: node scripts/android-fcm-preflight.mjs
