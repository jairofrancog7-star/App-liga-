name: Quiz Arena - prueba real Android
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quiz-mobile-smoke-v1071
  cancel-in-progress: false

jobs:
  visual-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build the actual Pages dist
        run: |
          npm install --prefer-offline --no-audit --no-fund
          npm run build -- --base=/App-liga-/
      - name: Install mobile Chromium
        run: |
          npm install --no-save playwright --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Start local GitHub Pages equivalent
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/quiz-preview.log 2>&1 &
          for i in $(seq 1 35); do
            curl --silent --fail http://127.0.0.1:4173/App-liga-/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/quiz-preview.log
          exit 1
      - name: Test 390x844 touch route end to end
        run: node tests/quiz-arena-browser-v1071.mjs
      - name: Upload screenshots and debug information
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quiz-arena-android-v1071
          path: |
            quiz-debug/*.png
            /tmp/quiz-preview.log
          if-no-files-found: ignore
