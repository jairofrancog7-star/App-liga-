name: Build Android Debug APK

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - skywork-rebuild-v1
    paths-ignore:
      - 'demo/**'
      - '*.md'
      - 'docs/**'
  pull_request:
    branches:
      - main

# Las compilaciones manuales usan un grupo propio y no son canceladas por
# nuevos pushes. Las compilaciones automáticas continúan priorizando la más reciente.
concurrency:
  group: android-debug-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Apply corrected full-blue Liga Juventino app icon
        run: |
          mkdir -p assets
          curl -fL 'https://d2ol7oe51mr4n9.cloudfront.net/user_3JNvttsAwr0QjxhuX5O1uaa9bvv/720d1f82-1d59-4a7a-af69-9e7e8da0250a.png' -o assets/icon.png
          npx --yes @capacitor/assets generate --android --iconBackgroundColor '#02065F' --iconBackgroundColorDark '#02065F'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Validate native APK features
        run: node --test tests/calendar-event.test.mjs tests/android-video-capture.test.mjs

      - name: Configure native APK features and version
        env:
          LJR_VERSION_CODE: ${{ github.run_number }}
        run: node native/android/configure.mjs

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Liga-Juventino-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable APK download
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Liga-Juventino.apk
          APP_BUILD=$(sed -n 's/.*<meta name="app-build" content="\([^"]*\)".*/\1/p' index.html | head -n1)
          NOTES="APK Android de Liga Juventino actualizado automáticamente desde main. Build: ${APP_BUILD:-desconocido}. Commit: ${GITHUB_SHA}. Incluye las funciones nativas actuales, entre ellas creación automática de partidos en Google Calendar."
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest Liga-Juventino.apk --clobber
            gh release edit android-latest --title "Liga Juventino Android" --notes "$NOTES"
          else
            gh release create android-latest Liga-Juventino.apk \
              --title "Liga Juventino Android" \
              --notes "$NOTES"
          fi
