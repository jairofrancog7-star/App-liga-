name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - skywork-rebuild-v1
      - feature/pixel-exact-reference-ui-v2
  pull_request:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Ensure Android project exists
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Generate local Liga Juventino Android icon and splash
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          mkdir -p assets

          convert -size 1024x1024 xc:'#02065F' \
            \( public/assets/league/liga-logo.webp -resize 710x710 \) \
            -gravity center -composite assets/icon.png

          convert -size 2732x2732 xc:'#02065F' \
            \( public/assets/reference/league-logo-white.webp -resize 800x800 \) \
            -gravity center -composite assets/splash.png

          npx --yes @capacitor/assets generate --android \
            --iconBackgroundColor '#02065F' \
            --iconBackgroundColorDark '#02065F' \
            --splashBackgroundColor '#02065F' \
            --splashBackgroundColorDark '#02065F'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Verify APK
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Liga-Juventino-reference-v3-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
