name: Build Android Debug APK

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - skywork-rebuild-v1
    paths-ignore:
      - 'demo/**'
      - '*.md'
      - 'docs/**'
  pull_request:
    branches:
      - main

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Apply corrected full-blue Liga Juventino app icon
        run: |
          mkdir -p assets
          curl -fL 'https://d2ol7oe51mr4n9.cloudfront.net/user_3JNvttsAwr0QjxhuX5O1uaa9bvv/720d1f82-1d59-4a7a-af69-9e7e8da0250a.png' -o assets/icon.png
          npx --yes @capacitor/assets generate --android --iconBackgroundColor '#02065F' --iconBackgroundColorDark '#02065F'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Enable native video Picture-in-Picture
        run: node native/android/configure.mjs

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Liga-Juventino-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable APK download
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Liga-Juventino.apk
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest Liga-Juventino.apk --clobber
          else
            gh release create android-latest Liga-Juventino.apk \
              --title "Liga Juventino Android" \
              --notes "APK Android de Liga Juventino. Este archivo se actualiza automáticamente con la versión más reciente de la app azul."
          fi
