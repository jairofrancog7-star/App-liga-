name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - skywork-rebuild-v1
      - branding-v7-icon-splash-header
  pull_request:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Apply Liga Juventino Android icon
        run: |
          python -m pip install --quiet cairosvg pillow
          python - <<'PY'
          import io, os
          from PIL import Image
          import cairosvg
          png=cairosvg.svg2png(url='public/icon.svg',output_width=512,output_height=512)
          im=Image.open(io.BytesIO(png)).convert('RGBA')
          sizes={'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}
          for folder,size in sizes.items():
              p=f'android/app/src/main/res/{folder}'
              os.makedirs(p,exist_ok=True)
              icon=im.resize((size,size),Image.Resampling.LANCZOS)
              icon.save(f'{p}/ic_launcher.png')
              icon.save(f'{p}/ic_launcher_round.png')
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Liga-Juventino-V7-branding-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
