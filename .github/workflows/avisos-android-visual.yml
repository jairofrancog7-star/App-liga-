name: Verificar Crear aviso en Android
on:
  push:
    paths:
      - 'tests/notice-editor-mobile-visual.mjs'
      - '.github/workflows/avisos-android-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-visual:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador de pruebas
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Probar selectores, autofill y diseño azul en Android
        run: node tests/notice-editor-mobile-visual.mjs
      - name: Guardar capturas de prueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avisos-android-visual
          path: artifacts/notice-editor/
          if-no-files-found: ignore
          retention-days: 7
