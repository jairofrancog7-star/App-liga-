name: Deploy Web to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'demo/**'
      - '*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-v8-fast
  # Mantener el despliegue actual hasta que termine. Si llegan otros commits,
  # GitHub encola la version mas reciente sin cancelar continuamente Pages.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Test runtime and official data regressions
        run: |
          node scripts/ensure-demo-notice-css.mjs
          node --test tests/*.test.mjs

      - name: Build for GitHub Pages
        env:
          # Clave pública limitada por HTTP referrer y API Street View Static.
          # Sin configuración, las tarjetas enlazan Google Maps sin imagen inventada.
          VITE_GOOGLE_STREETVIEW_API_KEY: ${{ secrets.GOOGLE_STREETVIEW_API_KEY }}
        run: npm run build -- --base=/App-liga-/

      - name: Verify requested mobile workflows
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          npm install --no-save playwright --no-audit --no-fund
          npx playwright install --with-deps chromium
          node tests/review-v875.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    needs: build
    timeout-minutes: 5
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
