    const norm=s=>String(s||'')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g,'')
      .toLowerCase()
      .replace(/\s+/g,' ')
      .trim();

    function isTarget(card){
      const h=norm(card.querySelector('h3,h4')?.textContent||'');
      const all=norm(card.textContent||'');
      return h==='abejas' &&
        all.includes('03 nov 2019') &&
        all.includes('tercer lugar') &&
        (all.includes('2018-2019') || all.includes('2018–2019'));
    }

    function paint(card){
      if(!card?.isConnected || !isTarget(card)) return;

      // Quita únicamente capas/parches anteriores de ESTA tarjeta.
      card.classList.remove(
        'v315-abejas-2019-bg',
        'v317-abejas-inline',
        'v316-abejas-2019',
        'v315-abejas-2019',
        'v311-abejas-2019'
      );
      card.querySelectorAll(
        ':scope > .v120-exact-event-bg,'+
        ':scope > .v35-history-bg-photo,'+
        ':scope > .v35-champion-bg-photo,'+
        ':scope > .v317-abejas-inline-photo,'+
        ':scope > .v314-abejas-photo,'+
        ':scope > .v311-abejas-photo,'+
        ':scope > .v318-abejas-bg'
      ).forEach(n=>n.remove());
      card.querySelectorAll(
        ':scope > .v317-abejas-shade,'+
        ':scope > .v314-abejas-shade,'+
        ':scope > .v311-abejas-shade,'+
        ':scope > .v318-abejas-shade'
      ).forEach(n=>n.remove());

      const img=document.createElement('img');
      img.className='v35-history-bg-photo v120-exact-event-bg v120-photo-only-bg v318-abejas-bg';
      img.alt='Abejas · Tercer lugar · Primera Fuerza · 03 nov 2019';
      img.src=PHOTO;
      img.loading='eager';
      img.decoding='sync';
      img.style.cssText=
        'position:absolute!important;inset:0!important;'+
        'width:100%!important;height:100%!important;'+
        'display:block!important;visibility:visible!important;opacity:1!important;'+
        'z-index:0!important;object-fit:cover!important;object-position:center 50%!important;'+
        'transform:none!important;filter:none!important;'+
        'margin:0!important;padding:0!important;border:0!important;'+
        'border-radius:inherit!important;pointer-events:none!important;';
      card.prepend(img);

      const shade=document.createElement('span');
      shade.className='v318-abejas-shade';
      shade.setAttribute('aria-hidden','true');
      shade.style.cssText=
        'position:absolute!important;inset:0!important;z-index:1!important;pointer-events:none!important;'+
        'background:linear-gradient(180deg,rgba(2,5,45,.03) 0%,rgba(2,5,45,.06) 35%,'+
        'rgba(2,5,45,.22) 66%,rgba(2,5,45,.62) 100%),'+
        'linear-gradient(90deg,rgba(2,5,45,.10),rgba(2,5,45,.01) 72%)!important;';
      card.insertBefore(shade,img.nextSibling);

      card.style.setProperty('position','relative','important');
      card.style.setProperty('overflow','hidden','important');
      card.style.setProperty('isolation','isolate','important');
      card.style.setProperty('display','block','important');
      card.style.setProperty('visibility','visible','important');
      card.style.setProperty('opacity','1','important');

      // Más corto en vertical. La foto cuadrada se recorta automáticamente arriba/abajo.
      card.style.setProperty('min-height','300px','important');
      card.style.setProperty('height','auto','important');
      card.style.setProperty('padding','0','important');

      card.style.setProperty('background-color','#060653','important');
      card.style.setProperty(
        'background-image',
        'linear-gradient(180deg,rgba(2,5,45,.03) 0%,rgba(2,5,45,.06) 35%,rgba(2,5,45,.22) 66%,rgba(2,5,45,.62) 100%),url("'+PHOTO+'")',
        'important'
      );
      card.style.setProperty('background-size','cover','important');
      card.style.setProperty('background-position','center 50%','important');
      card.style.setProperty('background-repeat','no-repeat','important');

      // Oculta las sombras azules viejas; se usa sólo la nueva sombra transparente.
      card.querySelectorAll(':scope > .v35-history-moment-shade,:scope > .v120-exact-shade').forEach(n=>{
        n.style.setProperty('display','none','important');
      });

      card.querySelectorAll('.v35-history-moment-content,.v35-champion-content,.v115-card-body').forEach(n=>{
        n.style.setProperty('position','relative','important');
        n.style.setProperty('z-index','2','important');
        n.style.setProperty('background','transparent','important');
        n.style.setProperty('background-image','none','important');
        n.style.setProperty('min-height','0','important');
      });

      card.querySelectorAll('.v35-history-status span,.v35-history-fact,.v35-champion-fact').forEach(n=>{
        n.style.setProperty('position','relative','important');
        n.style.setProperty('z-index','3','important');
        n.style.setProperty('background','rgba(3,8,70,.30)','important');
      });

      card.classList.add('v35-history-moment-photo','v120-has-exact-bg','v120-photo-only-card','v318-abejas-final');
      card.dataset.v318Abejas='ready';
    }

    function patch(){
      if(!/history|safe-about/.test(location.hash||'')) return;
      document.querySelectorAll('.v35-history-moment,.v35-champion-card,.v115-card').forEach(card=>{
        if(isTarget(card)) paint(card);
      });
    }

    let raf=0;
    function schedule(ms=0){
      clearTimeout(schedule.t);
      schedule.t=setTimeout(()=>{
        cancelAnimationFrame(raf);
        raf=requestAnimationFrame(patch);
      },ms);
    }

    window.addEventListener('hashchange',()=>schedule(40));
    document.addEventListener('click',e=>{
      if(e.target.closest('[data-v35-tab],button,[data-route]')) schedule(80);
    },true);

    new MutationObserver(ms=>{
      const relevant=ms.some(m=>[...m.addedNodes].some(n=>
        n.nodeType===1 &&
        !n.classList?.contains('v318-abejas-bg') &&
        !n.classList?.contains('v318-abejas-shade')
      ));
      if(relevant) schedule(30);
    }).observe(document.querySelector('#screen')||document.body,{childList:true,subtree:true});

    if(document.readyState==='loading'){
      document.addEventListener('DOMContentLoaded',()=>schedule(60),{once:true});
    }else{
      schedule(20);
    }
    setTimeout(patch,300);
    setTimeout(patch,900);
    setTimeout(patch,1800);
  })();
  </script>

</body>
</html>
