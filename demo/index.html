  (function(){
    if(window.__LJR_V577_MONITO_HARD_OPEN__)return;

    var lastOpen=0;
    function currentRoute(){
      return String(location.hash||'').replace(/^#\/?/,'').split('?')[0]||'home';
    }
    function openGallery(){
      var now=Date.now();
      if(now-lastOpen<350)return;
      lastOpen=now;
      try{
        if(window.LJR_APP_ROUTER&&typeof window.LJR_APP_ROUTER.go==='function'){
          window.LJR_APP_ROUTER.go('moreLessGallery');
        }else{
          location.hash='#/moreLessGallery';
        }
      }catch(_){
        location.hash='#/moreLessGallery';
      }
      /* Respaldo para navegadores Android donde otro listener reescribe el hash. */
      setTimeout(function(){
        if(currentRoute()!=='moreLessGallery')location.hash='#/moreLessGallery';
      },40);
    }
    function isMonito(e){
      if(currentRoute()!=='moreLess'||!(e.target instanceof Element))return false;
      var primary=e.target.closest('#screen [data-v12-moreless]');
      if(!primary)return false;
      var hit=e.target.closest(
        '.v12-ml-choice > button:not(.up-arrow):not(.down-arrow), .v12-ml-choice > button:not(.up-arrow):not(.down-arrow) .v12-avatar, .v12-avatar'
      );
      if(!hit||!primary.contains(hit))return false;
      var btn=hit.closest('button');
      if(btn&&(btn.classList.contains('up-arrow')||btn.classList.contains('down-arrow')))return false;
      return true;
    }
    function handle(e){
      if(!isMonito(e))return;
      e.preventDefault();
      e.stopPropagation();
      if(typeof e.stopImmediatePropagation==='function')e.stopImmediatePropagation();
      openGallery();
    }
    /* Captura antes que los handlers viejos: funciona con toque Android, mouse y click. */
    document.addEventListener('pointerup',handle,true);
    document.addEventListener('touchend',handle,{capture:true,passive:false});
    document.addEventListener('click',handle,true);
  })();

  <script>
    (function(){
      if(window.__LJR_QUIZ_V398_HARDLOCK__) return;
      window.__LJR_QUIZ_V398_HARDLOCK__=true;
      function lockQuiz(){
        var route=(location.hash||'').replace(/^#\/?/,'').split('?')[0];
        if(route!=='quizArena' && route!=='quiz') return;
        document.body.dataset.appRoute='quizArena';
        var app=document.getElementById('app');
        var screen=document.getElementById('screen');
        var topbar=app && app.querySelector(':scope > .topbar');
        if(topbar){
          topbar.style.setProperty('display','none','important');
          topbar.style.setProperty('visibility','hidden','important');
          topbar.style.setProperty('height','0','important');
          topbar.style.setProperty('min-height','0','important');
          topbar.style.setProperty('max-height','0','important');
          topbar.style.setProperty('padding','0','important');
          topbar.style.setProperty('margin','0','important');
        }
        if(!screen) return;
        var page=screen.querySelector('.v48-quiz-arena-page');
        if(!page) return;
        page.classList.add('v48-playing');
        var landing=page.querySelector('.v48-arena-landing');
        if(landing){landing.style.setProperty('display','none','important'); landing.setAttribute('aria-hidden','true');}
        var game=page.querySelector('.v48-game');
        if(game){game.style.setProperty('display','block','important'); game.setAttribute('aria-hidden','false');}
      }
      window.addEventListener('hashchange',function(){requestAnimationFrame(lockQuiz)});
      document.addEventListener('DOMContentLoaded',lockQuiz,{once:true});
      var mo=new MutationObserver(function(){lockQuiz()});
      mo.observe(document.documentElement,{subtree:true,childList:true});
      lockQuiz();
    })();
  </script>

    (function(){

        ['Juventus','https://res.cloudinary.com/rdk7ndhb/image/upload/v1/logos/Juventus_fpshqs',5,11,9],
        ['Linces','https://res.cloudinary.com/rdk7ndhb/image/upload/v1/logos/Linces_l1lc7c',4,6,9],
        ['Napoli','https://res.cloudinary.com/rdk7ndhb/image/upload/v1/logos/Napoli_cp25dv',5,3,9],
        ['Hermanos','https://res.cloudinary.com/rdk7ndhb/image/upload/v1/logos/Hermanos_kbfrmh',4,2,7],
        ['Franco FC','https://res.cloudinary.com/rdk7ndhb/image/upload/v1/logos/FrancoFC_vtd8d7',3,0,6]
      ];

      function route(){
        return String(location.hash||'').replace(/^#\/?/,'').split('?')[0]||'home';
      }
      function goStandings(){
        try{localStorage.setItem('competitionTab','standings')}catch(_){}
        location.hash='#/competition';
      }
      function mount(){
        if(route()!=='v38Stats') return;
        const screen=document.getElementById('screen');
        if(!screen) return;
        if(screen.querySelector('.v399-stats-summary,.v400-stats-fallback')) return;

        const note=[...screen.querySelectorAll('.v60-note')].find(el=>
          (el.textContent||'').includes('Estos accesos reutilizan las pantallas existentes')
        );
        if(!note) return;

        const host=note.closest('.v60-panel')||note;
        const wrap=document.createElement('section');
        wrap.className='v400-stats-fallback';
        wrap.setAttribute('aria-label','Tabla rápida de Primera Fuerza');
        wrap.innerHTML=
          '<div class="v400-stats-head"><div><small>PRIMERA FUERZA</small><h2>Tabla rápida</h2></div><button type="button" data-v400-table>Ver completa ›</button></div>'+
          '<div class="v400-leader"><img src="'+rows[0][1]+'" alt=""><span><small>LÍDER ACTUAL</small><b>'+rows[0][0]+'</b><em>'+rows[0][2]+' PJ · DG +'+rows[0][3]+'</em></span><strong>'+rows[0][4]+'<small>PTS</small></strong></div>'+
          '<div class="v400-table"><div class="v400-row head"><span>#</span><span>Equipo</span><span>PJ</span><span>DG</span><span>PTS</span></div>'+
          rows.map((r,i)=>'<button type="button" class="v400-row" data-v400-table><span class="v400-pos">'+(i+1)+'</span><span class="v400-team"><img src="'+r[1]+'" alt=""><b>'+r[0]+'</b></span><span>'+r[2]+'</span><span class="'+(r[3]>0?'v400-posdg':'')+'">'+(r[3]>0?'+':'')+r[3]+'</span><strong>'+r[4]+'</strong></button>').join('')+
          '</div>'+
          '<div class="v400-chips"><span><small>EQUIPOS</small><b>11</b></span><span><small>LÍDER</small><b>San José FC</b></span><span><small>PUNTOS</small><b>12</b></span></div>';
        host.insertAdjacentElement('afterend',wrap);
        wrap.querySelectorAll('[data-v400-table]').forEach(b=>b.addEventListener('click',goStandings));
      }

      let t=0;
      function schedule(){
        clearTimeout(t);
        t=setTimeout(mount,40);
      }
      window.addEventListener('hashchange',schedule);
      window.addEventListener('load',schedule);
      document.addEventListener('DOMContentLoaded',schedule,{once:true});
      const screen=document.getElementById('screen');
      if(screen)new MutationObserver(schedule).observe(screen,{childList:true,subtree:true});
      schedule();
      setTimeout(mount,400);
      setTimeout(mount,1200);
    })();
  </script>

<script>
(function(){

  function setImp(el,name,value){ if(el) el.style.setProperty(name,value,'important'); }
  function syncTvChrome(){
    const layer=document.querySelector('body > .v160-tv-layer');
    if(!layer)return;

    document.querySelectorAll('#app > .bottom-nav,.app-shell > .bottom-nav,nav.bottom-nav').forEach(nav=>{
      setImp(nav,'display','grid');
      setImp(nav,'visibility','visible');
      setImp(nav,'opacity','1');
      setImp(nav,'pointer-events','auto');
      setImp(nav,'z-index','2147483000');
    });

    setImp(layer,'z-index','2147482500');
    setImp(layer,'padding-bottom','calc(var(--v34-nav-h,69px) + 54px + env(safe-area-inset-bottom))');

      setImp(actions,'opacity','1');
      setImp(actions,'z-index','20');
      setImp(actions,'margin-bottom','14px');
    }
  }

  new MutationObserver(syncTvChrome).observe(document.documentElement,{childList:true,subtree:true});
  window.addEventListener('load',syncTvChrome);
  document.addEventListener('DOMContentLoaded',syncTvChrome,{once:true});
  syncTvChrome();
})();

  <script>
    (function(){
      if(window.__LJR_ENTRY_REVEAL_V626__)return;
      window.__LJR_ENTRY_REVEAL_V626__=true;
      var root=document.documentElement;
      var screen=document.querySelector('#screen');
      function hasRealContent(){
        if(!screen)return false;
        return screen.children.length>0 || (screen.textContent||'').trim().length>0;
      }
      function reveal(){
        root.classList.remove('ljr-preboot');
      }
      if(hasRealContent()){
        reveal();
        return;
      }
      if(screen){
        var observer=new MutationObserver(function(){
          if(hasRealContent()){
            reveal();
            observer.disconnect();
          }
        });
        observer.observe(screen,{childList:true,subtree:true,characterData:true});
      }
      window.addEventListener('load',function(){if(hasRealContent())reveal();},{once:true});
      setTimeout(reveal,1800);
    })();
  </script>
