  <script>
    (function(){
      if(window.__LJR_HISTORY_TAB_FASTLANE_V350__) return;
      window.__LJR_HISTORY_TAB_FASTLANE_V350__=true;
      document.addEventListener('click',function(e){
        const target=e.target && e.target.closest ? e.target.closest('[data-v35-tab]') : null;
        if(!target) return;
        const route=(location.hash.replace(/^#\/?/,'')||'home').split('?')[0];
        if(route!=='history') return;
        const fn=window.LJR_HISTORY_FAST_TAB;
        if(typeof fn!=='function') return;
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
        fn(target.dataset.v35Tab||'Resumen');
      },true);
    })();
  </script>

  <script>
    (function () {
      const mode = new URLSearchParams(location.search).get('mode') || '';
      const html = document.documentElement;
      if (mode === 'desktop') {
        html.classList.add('preview-desktop');
        const viewport = document.querySelector('meta[name="viewport"]');
        if (viewport) viewport.setAttribute('content', 'width=1366, initial-scale=1.0');
      } else if (mode === 'mobile' || mode === 'apk') {
        html.classList.add('preview-mobile');
        if (mode === 'apk') html.classList.add('preview-apk');
      }
      html.dataset.previewMode = mode || 'auto';
    })();
  </script>
