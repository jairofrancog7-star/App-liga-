  <link rel="apple-touch-icon" href="https://d2ol7oe51mr4n9.cloudfront.net/user_3JNvttsAwr0QjxhuX5O1uaa9bvv/a36f259b-1297-4204-a66a-0636164e61ab.png" />

  <title>Liga Juventino</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button id="backButton" class="icon-button back-button" aria-label="Volver"></button>
      <button class="wordmark" data-route="home" aria-label="Ir a Inicio">LIGA <strong>JUVENTINO</strong></button>
      <button class="icon-button profile-button" data-route="profile" aria-label="Perfil"></button>
    </header>

    <main id="screen" class="screen" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Navegación principal">
      <button data-route="home" class="nav-item active" aria-label="Inicio"><span class="nav-icon" data-nav-icon="home"></span><small>INICIO</small></button>
      <button data-route="competition" class="nav-item" aria-label="Competición"><span class="nav-icon" data-nav-icon="trophy"></span><small>COMPETICIÓN</small></button>
      <button data-route="video" class="nav-item" aria-label="Vídeo"><span class="nav-icon" data-nav-icon="play"></span><small>VÍDEO</small></button>
      <button data-route="fantasy" class="nav-item" aria-label="Fantasy"><span class="nav-icon" data-nav-icon="shirt"></span><small>FANTASY</small></button>
      <button data-route="more" class="nav-item" aria-label="Más"><span class="nav-icon" data-nav-icon="menu"></span><small>MÁS</small></button>
    </nav>
  </div>

  <script type="module" src="./src/main.js"></script>
  <script type="module" src="./src/runtime-fixes.js"></script>
  <script type="module" src="./src/v4-super.js"></script>
